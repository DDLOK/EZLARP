<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZLARP &mdash; jar decompiler</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">EZLARP</div>
  <nav class="tabs">
    <span class="tab active">DECOMPILER</span>
    <span class="tab muted">more soon</span>
  </nav>
</header>

<main class="wrap">
  <section class="drop" id="drop">
    <input type="file" id="file" accept=".jar,.class" hidden>
    <div class="drop-inner">
      <div class="big">Drop a <b>.jar</b> or <b>.class</b></div>
      <div class="sub">or <button id="pick" class="link">choose file</button></div>
      <div class="hint">in-browser decompile &middot; Vineflower on CheerpJ WASM &middot; nothing leaves your machine</div>
    </div>
  </section>

  <section class="status" id="status" hidden>
    <div class="row"><span class="k">file</span><span class="v" id="fname">&mdash;</span></div>
    <div class="row"><span class="k">size</span><span class="v" id="fsize">&mdash;</span></div>
    <div class="row"><span class="k">state</span><span class="v" id="fstate">idle</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </section>

  <section class="result" id="result" hidden>
    <div class="result-head">
      <div class="tabs files" id="filetabs"></div>
      <button id="dl" class="btn ghost">download all</button>
    </div>
    <pre id="code" class="code"></pre>
  </section>

  <section class="err" id="err" hidden></section>
</main>

<footer class="foot">EZLARP &middot; decompiler v0.2 &middot; vineflower in-browser (CheerpJ)</footer>
<script src="/app.js"></script>
</body>
</html>
